services:
  db:
    container_name: createBarrelDb
    image: postgres:14.19-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data 
    ports:
      - "5432:5432"
    environment:
        POSTGRES_DB: postgres
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: password 
volumes:
  postgres_data:
